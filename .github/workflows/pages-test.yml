name: Deploy GitHub Pages test

on:
  push:
    branches: [github-pages-test]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-test
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4

      - name: Build isolated Pages artifact
        run: |
          mkdir -p dist
          cp -R app/. dist/
          mkdir -p dist/assets
          cp -R assets/. dist/assets/
          python3 - <<'PY'
          from pathlib import Path
          import re

          replacements = {
              'dist/index.html': [
                  ('href="/app/', 'href="./'),
                  ('src="/app/', 'src="./'),
                  ('href="/manifest.webmanifest"', 'href="./manifest.webmanifest"'),
                  ('href="/styles.css"', 'href="./styles.css"'),
                  ('src="/app.js"', 'src="./app.js"'),
                  ('src="/update-notification.js"', 'src="./update-notification.js"'),
                  ('poster="../assets/', 'poster="./assets/'),
                  ('        <button class="warm-toggle" id="warmToggle" type="button" aria-pressed="false">Warm Off</button>\n', ''),
                  ('grid-template-columns:minmax(92px,1.5fr) 48px 52px 48px minmax(82px,1.2fr)', 'grid-template-columns:minmax(92px,1.5fr) 48px 52px 48px'),
                  ('grid-template-columns:minmax(78px,1.4fr) 44px 48px 44px minmax(74px,1.2fr)', 'grid-template-columns:minmax(78px,1.4fr) 44px 48px 44px'),
              ],
              'dist/manifest.webmanifest': [
                  ('"id": "/"', '"id": "./"'),
                  ('"start_url": "/"', '"start_url": "./"'),
                  ('"scope": "/"', '"scope": "./"'),
                  ('"src": "/app/', '"src": "./'),
                  ('"url": "/#listen"', '"url": "./#listen"'),
                  ('"url": "/#contact"', '"url": "./#contact"'),
              ],
              'dist/service-worker.js': [
                  ("  '/',", "  './',"),
                  ("  '/styles.css',", "  './styles.css',"),
                  ("  '/app.js',", "  './app.js',"),
                  ("  '/update-notification.js',", "  './update-notification.js',"),
                  ("  '/manifest.webmanifest',", "  './manifest.webmanifest',"),
                  ("  '/app/", "  './"),
                  ("caches.match('/')", "caches.match('./')"),
              ],
              'dist/update-notification.js': [
                  ("register('/service-worker.js',{scope:'/'})", "register('./service-worker.js',{scope:'./'})"),
              ],
              'dist/app.js': [
                  ("new URL('../assets/images/", "new URL('./assets/images/"),
                  ("const warmToggle=document.getElementById('warmToggle');", ''),
                  ("let warmEnabled=false;let audioContext=null;let mediaSource=null;let lowShelf=null;let highShelf=null;", ''),
                  ('resumeWarmAudioContext();', ''),
                  ("if(warmToggle){updateWarmUI();warmToggle.addEventListener('click',()=>setWarmEffect(!warmEnabled))}", ''),
              ],
          }

          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text()
              for old, new in pairs:
                  text = text.replace(old, new)
              if filename == 'dist/app.js':
                  text, count = re.subn(r"function initializeWarmAudio\(\).*?(?=function changeVolume)", "", text, count=1)
                  if count != 1:
                      raise RuntimeError('Warm audio function block was not found exactly once')
              path.write_text(text)

          # Fail the build rather than deploy a partial Warm removal.
          index = Path('dist/index.html').read_text()
          app_js = Path('dist/app.js').read_text()
          forbidden = ('warmToggle', 'Warm Off', 'Warm On', 'initializeWarmAudio', 'resumeWarmAudioContext', 'setWarmEffect', 'createMediaElementSource')
          leftovers = [token for token in forbidden if token in index or token in app_js]
          if leftovers:
              raise RuntimeError(f'Warm removal incomplete: {leftovers}')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
